<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BillGen — Simple Bill Generator</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="auth-layout">
    <div class="card" style="text-align: center;">
      <div class="brand" style="justify-content: center;">
        <div class="brand-icon">❖</div>
        <div>
          <h1>BillGen</h1>
          <p class="muted">Simple bill generation for small businesses</p>
        </div>
      </div>
      <p class="subtitle" style="margin: 1.5rem 0;">Create invoices, manage customers, and print bills — free on
        Firebase.</p>
      <a class="btn btn-primary btn-block" href="register.html" style="margin-bottom: 0.75rem;">Create Account</a>
      <a class="btn btn-secondary btn-block" href="login.html">Login</a>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/auth.js"></script>
  <script>
    auth.onAuthStateChanged(async (user) => {
      if (!user) return;
      if (isAdminEmail(user.email)) {
        window.location.href = "dashboard.html";
        return;
      }
      try {
        const snap = await db.collection("users").doc(user.uid).get();
        if (snap.exists && snap.data().status === "approved") {
          window.location.href = "dashboard.html";
        }
      } catch (e) {}
    });
  </script>
</body>

</html>
