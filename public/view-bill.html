<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Invoice — BillGen</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/quotation.css">
</head>
<body>
  <div class="container no-print">
    <nav class="nav-bar">
      <a class="btn btn-secondary" href="dashboard.html">← Dashboard</a>
      <div class="nav-actions">
        <button class="btn btn-primary" id="downloadPdfBtn" type="button">Download PDF</button>
        <button class="btn btn-secondary" id="printBtn" type="button">Print</button>
        <a class="btn btn-secondary" href="create-bill.html">+ New Invoice</a>
      </div>
    </nav>
  </div>

  <div class="quotation-wrap">
    <div id="billContainer"></div>
    <div id="loadingState" class="empty-state">
      <div class="spinner-large"></div>
      <p id="loadingStatusText" style="margin-top: 0.75rem; font-weight: 500;">Loading invoice preview…</p>
    </div>
    <div id="notFound" class="empty-state" hidden>
      <p id="notFoundMessage">Bill not found or you do not have access.</p>
      <a class="btn btn-secondary" href="dashboard.html">Go to dashboard</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/assets-data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/quotation-template.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/bills.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const billId = params.get("id");
    const autoDownload = params.get("download") === "true";
    let currentBillNumber = "";

    const printBtn = document.getElementById("printBtn");
    const downloadPdfBtn = document.getElementById("downloadPdfBtn");
    const loadingState = document.getElementById("loadingState");
    const notFound = document.getElementById("notFound");
    const notFoundMessage = document.getElementById("notFoundMessage");

    function setActionsEnabled(enabled) {
      printBtn.disabled = !enabled;
      downloadPdfBtn.disabled = !enabled;
    }

    setActionsEnabled(false);

    printBtn.addEventListener("click", () => {
      if (!document.getElementById("quotationDocument")) {
        alert("Invoice is still loading. Please wait.");
        return;
      }
      window.print();
    });

    downloadPdfBtn.addEventListener("click", () => {
      if (!document.getElementById("quotationDocument")) {
        alert("Invoice is still loading. Please wait.");
        return;
      }
      downloadQuotationPdf(currentBillNumber);
    });

    function showNotFound(message) {
      loadingState.hidden = true;
      notFoundMessage.textContent = message;
      notFound.hidden = false;
      setActionsEnabled(false);
    }

    requireAuth().then(async (user) => {
      if (!billId) {
        showNotFound("Invalid bill link. Open a bill from the dashboard.");
        return;
      }

      try {
        // Parallel fetch for lightning speed
        const [result, profile] = await Promise.all([
          loadBillById(billId, user.uid),
          loadSellerProfile(user.uid)
        ]);

        if (result.error) {
          const messages = {
            "not-found": "Bill not found. It may have been deleted.",
            "forbidden": "You do not have access to this bill.",
            "permission-denied": "Cannot read bill — Firestore rules may be blocking access. Redeploy rules from the project.",
            "missing-auth": "Please log in again to view this bill."
          };
          showNotFound(messages[result.error] || "Bill not found or you do not have access.");
          return;
        }

        currentBillNumber = result.billNumber || result.id;
        loadingState.hidden = true;
        document.getElementById("billContainer").innerHTML = renderQuotationHTML(result, profile);
        setActionsEnabled(true);

        if (autoDownload) {
          setTimeout(() => {
            downloadQuotationPdf(currentBillNumber);
          }, 350);
        }
      } catch (error) {
        console.error("[PAGE] Error:", error);
        showNotFound(error.message || "Failed to load bill.");
      }
    });
  </script>
</body>
</html>
