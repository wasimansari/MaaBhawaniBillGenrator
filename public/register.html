<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — BillGen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-layout">
    <div class="card">
      <div class="brand">
        <div class="brand-icon">BG</div>
        <div>
          <h1>Create account</h1>
          <p class="muted">Register with valid details</p>
        </div>
      </div>
      <form id="registerForm">
        <div class="form-group">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" required autocomplete="name">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="mobile">Mobile (10 digits)</label>
          <input id="mobile" name="mobile" type="tel" inputmode="numeric" maxlength="10" placeholder="9876543210" required>
        </div>
        <div class="form-group">
          <label for="address">Address</label>
          <textarea id="address" name="address" required placeholder="Shop / business address"></textarea>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" minlength="6" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" minlength="6" required autocomplete="new-password">
        </div>
        <div id="message" class="message" hidden></div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Register</button>
      </form>
      <p class="form-footer">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById("registerForm");
    const messageEl = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    auth.onAuthStateChanged((user) => {
      if (user) window.location.href = "dashboard.html";
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      registerUser(form, messageEl, submitBtn);
    });
  </script>
</body>
</html>
