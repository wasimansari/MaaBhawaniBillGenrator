<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — BillGen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-layout">
    <div class="card">
      <div class="brand">
        <div class="brand-icon">BG</div>
        <div>
          <h1>Welcome back</h1>
          <p class="muted">Login with your credentials</p>
        </div>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <div id="message" class="message" hidden></div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Login</button>
      </form>
      <p class="form-footer">New user? <a href="register.html">Create account</a></p>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const messageEl = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    auth.onAuthStateChanged((user) => {
      if (user) window.location.href = "dashboard.html";
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      loginUser(form, messageEl, submitBtn);
    });
  </script>
</body>
</html>
